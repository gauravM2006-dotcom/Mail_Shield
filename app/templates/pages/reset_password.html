{% extends "base_public.html" %}

{% block title %}Set New Password — Mail Shield{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-4 col-lg-5 col-md-7 col-sm-10">
      <div class="ms-card p-4 p-md-5 shadow-sm border">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Mail Shield" class="ms-brand-logo-img mx-auto mb-3" style="width: 52px; height: 52px;">
          <h3 class="fw-bold mb-1" style="color: var(--ms-navy);">Set New Password</h3>
          <p class="text-muted small mb-0">Enter your new secure account password</p>
        </div>

        <div id="reset-alert" class="alert alert-danger d-none small py-2 px-3 border-0 rounded-3 mb-3"></div>

        <form id="reset-form">
          <div class="mb-3">
            <label class="form-label" for="reset-new-password">New Password</label>
            <input type="password" class="form-control" id="reset-new-password" placeholder="••••••••" required autocomplete="new-password">
            <div class="text-muted mt-1" style="font-size: 11px;">Min 8 chars, uppercase, lowercase, number & symbol</div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="reset-confirm-password">Confirm Password</label>
            <input type="password" class="form-control" id="reset-confirm-password" placeholder="••••••••" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-semibold" id="btn-reset-submit">
            Update Password
          </button>
        </form>

        <div class="text-center small text-muted">
          Back to <a href="/login" class="text-primary fw-semibold">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { apiRequest } from "/static/js/api.js";
  import { showToast } from "/static/js/toast.js";

  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("reset-alert");
  const token = "{{ token }}";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.add("d-none");
    const pwd = document.getElementById("reset-new-password").value;
    const confirm = document.getElementById("reset-confirm-password").value;

    if (pwd !== confirm) {
      alertBox.textContent = "Passwords do not match.";
      alertBox.classList.remove("d-none");
      return;
    }

    try {
      const res = await apiRequest("/api/auth/reset", {
        method: "POST",
        body: { token, password: pwd }
      });
      showToast("Password updated successfully!", "success");
      window.location.href = "/login";
    } catch (err) {
      alertBox.textContent = err.message || "Failed to update password.";
      alertBox.classList.remove("d-none");
    }
  });
</script>
{% endblock %}
