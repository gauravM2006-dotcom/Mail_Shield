{% extends "base_public.html" %}

{% block title %}Forgot Password — Mail Shield{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-4 col-lg-5 col-md-7 col-sm-10">
      <div class="ms-card p-4 p-md-5 shadow-sm border">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Mail Shield" class="ms-brand-logo-img mx-auto mb-3" style="width: 52px; height: 52px;">
          <h3 class="fw-bold mb-1" style="color: var(--ms-navy);">Reset Password</h3>
          <p class="text-muted small mb-0">Enter your email and we will generate reset instructions</p>
        </div>

        <div id="forgot-alert" class="alert alert-success d-none small py-2 px-3 border-0 rounded-3 mb-3"></div>

        <form id="forgot-form">
          <div class="mb-4">
            <label class="form-label" for="forgot-email">Account Email Address</label>
            <input type="email" class="form-control" id="forgot-email" placeholder="name@example.com" required autocomplete="email">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-semibold" id="btn-forgot-submit">
            Send Reset Instructions
          </button>
        </form>

        <div class="text-center small text-muted">
          Remember your password? <a href="/login" class="text-primary fw-semibold">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { apiRequest } from "/static/js/api.js";
  const form = document.getElementById("forgot-form");
  const alertBox = document.getElementById("forgot-alert");
  const btn = document.getElementById("btn-forgot-submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Sending...`;

    try {
      const res = await apiRequest("/api/auth/forgot", {
        method: "POST",
        body: { email: document.getElementById("forgot-email").value }
      });
      alertBox.className = "alert alert-success small py-2 px-3 border-0 rounded-3 mb-3";
      alertBox.textContent = res.data.message;
      if (res.data.reset_token) {
        alertBox.innerHTML += `<div class="mt-2 pt-2 border-top"><strong>Dev Link:</strong> <a href="/reset/${res.data.reset_token}" class="text-primary">Click to Reset Password</a></div>`;
      }
      alertBox.classList.remove("d-none");
      form.reset();
    } catch (err) {
      alertBox.className = "alert alert-danger small py-2 px-3 border-0 rounded-3 mb-3";
      alertBox.textContent = err.message || "Failed to process request.";
      alertBox.classList.remove("d-none");
    } finally {
      btn.disabled = false;
      btn.innerHTML = `Send Reset Instructions`;
    }
  });
</script>
{% endblock %}
